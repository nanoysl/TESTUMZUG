<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Räumdienst Borken – Entrümpelung & Haushaltsauflösung</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#060912;
  --panel:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.14);
  --text:#fff;
  --muted:rgba(255,255,255,.7);
  --orange:#F08A1A;
  --radius:22px;
  --ease:cubic-bezier(.2,.8,.2,1);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Manrope,system-ui;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 10% 10%, rgba(40,90,180,.45), transparent),
    radial-gradient(700px 400px at 90% 20%, rgba(240,138,26,.35), transparent),
    linear-gradient(#050812,#02040a);
}

.container{max-width:1200px;margin:0 auto;padding:20px}

header{
  position:sticky;top:0;z-index:20;
  backdrop-filter:blur(14px);
  background:rgba(5,7,15,.75);
  border-bottom:1px solid var(--border);
}
header .container{
  display:flex;align-items:center;justify-content:space-between;
}
header strong{font-weight:800}

.btn{
  padding:14px 18px;
  border-radius:14px;
  font-weight:800;
  background:linear-gradient(135deg,#F08A1A,#E24A2A);
  border:none;
  color:#fff;
}

.hero{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:24px;
  margin-top:24px;
}
.heroBox{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px;
}
.hero h1{
  font-size:clamp(28px,4vw,46px);
  margin:0 0 12px;
}
.hero p{color:var(--muted)}

.carouselCard{
  position:relative;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
}

.track{
  display:flex;
  gap:14px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
}
.slide{
  flex:0 0 88%;
  scroll-snap-align:start;
  border-radius:18px;
  overflow:hidden;
}
.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:pointer;
}

/* Swipe hint */
.swipeHint{
  position:absolute;
  right:14px;
  bottom:14px;
  padding:8px 12px;
  font-size:12px;
  font-weight:800;
  background:rgba(0,0,0,.45);
  border-radius:999px;
  opacity:0;
  transform:translateY(8px);
  transition:.25s var(--ease);
  pointer-events:none;
}
.swipeHint.show{
  opacity:1;
  transform:translateY(0);
}

/* Lightbox */
.lightbox{
  position:fixed;inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}
.lightbox.open{display:flex}
.lightbox img{
  max-width:92vw;
  max-height:85vh;
  border-radius:18px;
}

/* Mobile */
@media(max-width:900px){
  .hero{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="container">
    <strong>Räumdienst Borken</strong>
    <a class="btn" href="tel:+4917646620710">Besichtigung</a>
  </div>
</header>

<main class="container">

<section class="hero">
  <div class="heroBox">
    <h1>Entrümpelung & Haushaltsauflösung in Borken</h1>
    <p>Diskret. Sauber. Fairer Festpreis nach kostenloser Besichtigung.</p>
  </div>

  <div class="carouselCard" id="refCarousel">
    <div class="track" id="track">
      <div class="slide"><img src="IMG_7436.jpg"></div>
      <div class="slide"><img src="IMG_7437.jpg"></div>
      <div class="slide"><img src="IMG_7438.jpg"></div>
      <div class="slide"><img src="IMG_7439.jpg"></div>
    </div>
    <div class="swipeHint" id="swipeHint">Wischen →</div>
  </div>
</section>

</main>

<div class="lightbox" id="lightbox">
  <img id="lbImg">
</div>

<script>
/* ===== Carousel Autoplay ===== */
const track = document.getElementById('track');
const slides = [...track.children];
let autoplayTimer = null;
let userPausedUntil = 0;

function currentIndex(){
  const w = slides[0].offsetWidth;
  return Math.round(track.scrollLeft / w);
}
function scrollToIndex(i){
  track.scrollTo({left:slides[i].offsetLeft,behavior:'smooth'});
}
function startAutoplay(){
  if(autoplayTimer) return;
  autoplayTimer = setInterval(()=>{
    if(Date.now() < userPausedUntil) return;
    scrollToIndex((currentIndex()+1)%slides.length);
  },3600);
}
function pauseAutoplay(ms=6000){
  userPausedUntil = Date.now()+ms;
}

track.addEventListener('scroll',()=>pauseAutoplay());

/* ===== Lightbox ===== */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
slides.forEach(s=>{
  s.querySelector('img').onclick=()=>{
    lbImg.src=s.querySelector('img').src;
    lb.classList.add('open');
    document.body.style.overflow='hidden';
    pauseAutoplay(9999999);
  };
});
lb.onclick=()=>{
  lb.classList.remove('open');
  document.body.style.overflow='';
  pauseAutoplay(1000);
};

/* ===== Swipe Hint (re-trigger on view) ===== */
const swipeHint=document.getElementById('swipeHint');
let hintCooldown=0;

const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting && Date.now()>hintCooldown){
      hintCooldown=Date.now()+8000;
      swipeHint.classList.add('show');
      setTimeout(()=>swipeHint.classList.remove('show'),2200);
    }
  });
},{threshold:.45});

io.observe(document.getElementById('refCarousel'));

startAutoplay();
</script>

</body>
</html>
